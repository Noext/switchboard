version: 2
updates:
  # Keep the MCP SDK and the framework current; those are the two dependencies where an
  # upstream change is most likely to require a code change.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      mcp-sdk:
        patterns:
          - "@modelcontextprotocol/*"
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Major bumps of the framework need a manual migration (see docs/architecture.md).
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
