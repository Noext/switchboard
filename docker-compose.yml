services:
  switchboard:
    build: .
    container_name: switchboard
    restart: unless-stopped
    env_file: .env
    ports:
      - "${SWITCHBOARD_PORT:-3020}:3000"
    volumes:
      - /srv/switchboard:/data
      # Allows stdio MCPs distributed as Docker images (`docker exec -i <ct> <cmd>`).
      # SECURITY: the Docker socket is root on the host. Anything running in this container —
      # including an upstream's stdio process it spawns — can control the whole daemon. Only
      # mount it where every configured upstream is trusted, and drop it if that stops being true.
      - /var/run/docker.sock:/var/run/docker.sock
    # The socket is root:docker (gid 105 on the host). The container user is uid 1001, so it
    # needs that GID as a supplementary group to open the socket. If the host's docker group GID
    # ever changes, this must change too — the symptom is "permission denied" on the socket.
    group_add:
      - "105"
    environment:
      - SWITCHBOARD_DATA_DIR=/data
      - SWITCHBOARD_PORT=3000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
